[package]
name = "tars-kb"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Fast local knowledge bases with progressive disclosure and temporal memory"
license = "MIT"
repository = "https://github.com/cottrellashley/tars-kb"
keywords = ["knowledge-base", "memory", "cli", "agents", "temporal"]
categories = ["command-line-utilities"]

[features]
fault-injection = []

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
jiff = { version = "0.2", features = ["serde"] }
rusqlite = { version = "0.40", features = ["bundled"] }
pulldown-cmark = "0.13"
unicode-casefold = "0.2"
tempfile = "3"
url = "2"
libc = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
