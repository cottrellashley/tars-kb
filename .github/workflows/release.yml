name: Linux release

on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Use a canonical temporary directory
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          location = Path(os.environ["RUNNER_TEMP"]).resolve(strict=True)
          with open(os.environ["GITHUB_ENV"], "a") as output:
              output.write(f"TMPDIR={location}\nTARS_KB_CI_TMP={location}\n")
          PY
      - name: Verify source and public boundary
        run: |
          cargo +stable fmt --check
          cargo +stable clippy --locked --all-targets -- -D warnings
          cargo +stable test --locked --all-targets
          cargo +stable test --locked --all-targets --features fault-injection
          python3 scripts/public-check.py --self-test
          python3 scripts/public-check.py
      - name: Build and verify
        run: |
          cargo +stable build --locked --release --target ${{ matrix.target }}
          cp -R examples/library "$TARS_KB_CI_TMP/example-library"
          ./target/${{ matrix.target }}/release/tars-kb --root "$TARS_KB_CI_TMP/example-library" --json validate sample
      - name: Package
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          mkdir -p dist
          tar -czf "dist/tars-kb-${GITHUB_REF_NAME}-${RELEASE_TARGET}.tar.gz" -C "target/${RELEASE_TARGET}/release" tars-kb -C "$GITHUB_WORKSPACE" LICENSE README.md docs specs schemas examples
          cd dist
          sha256sum *.tar.gz > "SHA256SUMS-${RELEASE_TARGET}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Publish checksummed archives
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd dist
          cat SHA256SUMS-* > SHA256SUMS
          sha256sum --check SHA256SUMS
          gh release create "$RELEASE_TAG" --verify-tag --generate-notes ./*.tar.gz SHA256SUMS
